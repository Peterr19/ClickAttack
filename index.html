<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Click Attack</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <h1 id="title">Click Attack Game</h1>

    <label for="playerName">Player Name:</label>
    <input id="playerName" type="text" placeholder="Enter your name">

    <label for="attackValue">Attack Value (1-10):</label>
    <input id="attackValue" type="number" min="1" max="10" placeholder="1-10">

    <p>Score: <span id="score">0</span></p>

    <button id="attackButton">Attack</button>
    <button id="resetButton">Reset</button>

    <p id="message"></p>
    <h2>Attack History</h2>
    <ul id="attackHistory"></ul>
</body>
</html>
